<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Clawd 桌宠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* Layout: one-screen app — a "monitor" stage where the pet lives, with a status/control dock below */
:root {
  --bg: #e4e7ec;
  --screen: #f3f5f8;
  --screen-dot: #d6dbe3;
  --desk: #cdb9a0;
  --desk-edge: #b29a7d;
  --fg: #22252b;
  --muted: #6b7280;
  --frame: #2b2e35;
  --dock: #ffffff;
  --line: #d3d8e0;
  --accent: #d97757;
  --accent-ink: #ffffff;
  --bubble: #ffffff;
  --bubble-ink: #22252b;
  --bar-food: #e0a24a;
  --bar-mood: #e46f8f;
  --font-pixel: "Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-body: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --screen: #181b21; --screen-dot: #262a33; --desk: #3a3129; --desk-edge: #4a3f34;
    --fg: #e8eaee; --muted: #9aa1ad; --frame: #050608; --dock: #1b1e24; --line: #2c313a;
    --accent: #e08463; --accent-ink: #1a0f0a; --bubble: #262a32; --bubble-ink: #eef0f3;
    --bar-food: #e3aa55; --bar-mood: #ea7d99; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --screen: #181b21; --screen-dot: #262a33; --desk: #3a3129; --desk-edge: #4a3f34;
  --fg: #e8eaee; --muted: #9aa1ad; --frame: #050608; --dock: #1b1e24; --line: #2c313a;
  --accent: #e08463; --accent-ink: #1a0f0a; --bubble: #262a32; --bubble-ink: #eef0f3;
  --bar-food: #e3aa55; --bar-mood: #ea7d99; color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
* { -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
.app {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-rows: 1fr auto; gap: 12px;
  padding-inline: 16px; padding-block: 16px;
  max-width: 1100px; margin: 0 auto;
}
.monitor {
  position: relative; min-height: 260px; border-radius: 14px; overflow: hidden;
  border: 6px solid var(--frame); background: var(--screen);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.hint {
  position: absolute; top: 10px; left: 12px; right: 12px;
  font-size: 12px; color: var(--muted); pointer-events: none;
}
.bubble {
  position: absolute; left: 0; top: 0; max-width: 220px;
  background: var(--bubble); color: var(--bubble-ink);
  font-size: 14px; line-height: 1.4; padding: 7px 11px;
  border: 2px solid var(--frame); border-radius: 4px;
  box-shadow: 3px 3px 0 var(--frame);
  pointer-events: none; white-space: nowrap;
  transition: opacity .15s;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px;
  width: 10px; height: 10px; background: var(--bubble);
  border-right: 2px solid var(--frame); border-bottom: 2px solid var(--frame);
  transform: rotate(45deg) translate(-2px,-2px);
}
.dock {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  background: var(--dock); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px;
}
.name { font-family: var(--font-pixel); font-size: 18px; letter-spacing: .04em; }
.name small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); letter-spacing: 0; }
.stats { display: grid; gap: 6px; flex: 1 1 200px; min-width: 0; }
.stat { display: grid; grid-template-columns: 34px 1fr 30px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.stat b { font-family: var(--font-pixel); font-weight: 400; font-variant-numeric: tabular-nums; text-align: right; color: var(--fg); }
.track { height: 10px; border: 2px solid var(--frame); background: var(--screen); }
.fill { height: 100%; width: 50%; transition: width .3s; }
#foodFill { background: var(--bar-food); }
#moodFill { background: var(--bar-mood); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit; font-size: 14px; cursor: pointer;
  background: var(--screen); color: var(--fg);
  border: 2px solid var(--frame); border-radius: 4px; padding: 6px 12px;
  box-shadow: 2px 2px 0 var(--frame);
}
button:active { transform: translate(2px,2px); box-shadow: none; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 520px) {
  .hint { font-size: 11px; }
  button { padding: 6px 10px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="monitor" id="monitor">
    <canvas id="stage" aria-label="桌宠 Clawd 的小桌面"></canvas>
    <div class="hint">点它摸摸 · 按住拖起来 · 点空白处叫它过来</div>
    <div class="bubble" id="bubble" hidden></div>
  </div>
  <div class="dock">
    <div class="name">CLAWD<small id="status">发呆中</small></div>
    <div class="stats">
      <div class="stat">饱腹<div class="track"><div class="fill" id="foodFill"></div></div><b id="foodNum">50</b></div>
      <div class="stat">心情<div class="track"><div class="fill" id="moodFill"></div></div><b id="moodNum">50</b></div>
    </div>
    <div class="actions">
      <button class="primary" id="btnFeed">投喂饼干</button>
      <button id="btnPet">摸摸头</button>
      <button id="btnJump">跳一下</button>
      <button id="btnSleep">哄睡</button>
    </div>
  </div>
</div>

<script>
(() => {
  const monitor = document.getElementById('monitor');
  const C = document.getElementById('stage');
  const ctx = C.getContext('2d');
  const bubble = document.getElementById('bubble');
  const statusEl = document.getElementById('status');
  const U = 6; // one sprite pixel in CSS px
  let W = 300, H = 300, floor = 270;
  let colors = {};

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    const g = n => s.getPropertyValue(n).trim();
    colors = { dot: g('--screen-dot'), desk: g('--desk'), edge: g('--desk-edge'), muted: g('--muted') };
  }
  function resize() {
    const r = monitor.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    W = r.width - 12; H = r.height - 12; // minus border
    C.width = Math.round(W * dpr); C.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
    floor = H - 26;
    pet.x = clamp(pet.x, 60, W - 60);
    if (pet.state !== 'held' && pet.state !== 'fall' && pet.state !== 'jump') pet.y = floor;
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---- saved stats ----
  // Scriptable replaces the marker below with {food, mood, action, sleepy}
  const INIT = /*CLAWD_INIT*/null || {};
  const stats = { food: INIT.food ?? 70, mood: INIT.mood ?? 70 };
  let lastAction = null;
  window.clawdStats = () => JSON.stringify({ food: stats.food, mood: stats.mood, lastAction });

  // ---- pet ----
  const pet = {
    x: 200, y: 270, vy: 0, dir: 1, state: 'idle', t: 0, next: 2,
    target: null, squash: 0, blink: 0, nextBlink: 2, idleFor: 0, walkPhase: 0, foodRef: null
  };
  const foods = [];
  const parts = [];

  const STATUS = { idle: '发呆中', walk: '溜达中', held: '被拎起来了', fall: '掉下去了', jump: '蹦！', happy: '超开心', eat: '吃东西中', sleep: '睡着了 zzz', dizzy: '有点晕' };
  function setState(s, dur) {
    pet.state = s; pet.t = 0; pet.next = dur ?? 0;
    statusEl.textContent = STATUS[s] || '';
  }

  // ---- speech ----
  let bubbleTimer = 0;
  function say(text, secs = 2.4) {
    bubble.textContent = text; bubble.hidden = false; bubbleTimer = secs;
  }
  const LINES = {
    tap: ['嘿嘿～', '摸摸头！', '再摸一下嘛', '嗯？叫我吗', '(开心地挥手)', '今天也要加油写代码'],
    idle: ['git push 了吗？', '要不要喝口水', '我在看着你写代码哦', '测试都过了吗', '休息一下眼睛吧', '这个 bug 我好像见过…', '记得提交代码哦'],
    hungry: ['肚子咕咕叫…', '有饼干吗…', '饿饿'],
    come: ['来了来了', '这就来！', '冲！'],
    land: ['晕…', '眼冒金星…', '下次轻点放嘛'],
    held: ['哇啊啊——', '放我下来！', '好高！'],
    wake: ['唔…我醒着呢', '没睡没睡', '刚才在思考'],
    eat: ['好吃！', '嚼嚼嚼', '再来一块！']
  };

  // ---- drawing ----
  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

  function drawPet() {
    const p = pet, s = p.state;
    const walking = s === 'walk';
    const step = Math.floor(p.walkPhase) % 2;
    const bob = walking ? (step ? -U * 0.5 : 0) : (s === 'sleep' ? Math.sin(p.t * 2) * 1.5 : 0);
    const BODY = '#d97757', DARK = '#d97757', EYE = '#1b1411', LEG = '#c4664a';

    // shadow
    const air = Math.max(0, floor - p.y);
    const sh = clamp(1 - air / 300, 0.3, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath(); ctx.ellipse(p.x, floor + 2, 7 * U * sh, 1.2 * U * sh, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(p.x, p.y);
    const sq = p.squash;
    ctx.scale(1 + sq * 0.6, 1 - sq);
    if (s === 'held') ctx.rotate(Math.sin(p.t * 8) * 0.12);

    // legs
    const legCols = [-5, -3, 2, 4];
    legCols.forEach((c, i) => {
      let h = 2 * U;
      if (walking && (i % 2) === step) h = U;
      if (s === 'held') h = 2 * U + (i % 2 ? 2 : 0);
      if (s === 'sleep') h = U * 0.8;
      px(c * U, -h, U, h, LEG);
    });
    const legH = s === 'sleep' ? U * 0.8 : 2 * U;
    const top = -legH - 7 * U + bob;

    // body
    px(-6 * U, top, 12 * U, 7 * U, BODY);
    // arms
    let armY = top + 3 * U;
    let lA = 0, rA = 0;
    if (s === 'happy' || s === 'held') { lA = Math.sin(p.t * 18) > 0 ? -U : 0; rA = Math.sin(p.t * 18) > 0 ? 0 : -U; }
    if (s === 'eat') { lA = rA = Math.sin(p.t * 14) > 0 ? -U : 0; }
    px(-7 * U, armY + lA, U, 2 * U, DARK);
    px(6 * U, armY + rA, U, 2 * U, DARK);

    // eyes
    const look = (walking || s === 'eat') ? p.dir : 0;
    const eyes = [-4 + look, 3 + look];
    const eyeTop = top + 2 * U;
    const blinking = p.blink > 0;
    eyes.forEach((c, i) => {
      const ex = c * U;
      if (s === 'sleep') {
        px(ex - U * 0.25, eyeTop + 1.5 * U, U * 1.5, U * 0.5, EYE);
      } else if (s === 'happy') {
        px(ex - U * 0.5, eyeTop + U, U * 0.5, U * 0.5, EYE);
        px(ex, eyeTop + U * 0.5, U, U * 0.5, EYE);
        px(ex + U, eyeTop + U, U * 0.5, U * 0.5, EYE);
      } else if (s === 'dizzy') {
        const up = (Math.floor(p.t * 6) + i) % 2;
        px(ex, eyeTop + (up ? 0 : U), U, U, EYE);
      } else if (blinking) {
        px(ex, eyeTop + 1.25 * U, U, U * 0.5, EYE);
      } else {
        px(ex, eyeTop, U, 2 * U, EYE);
      }
    });
    // mouth while eating
    if (s === 'eat' && Math.sin(p.t * 14) > 0) px(-U, top + 5 * U, 2 * U, U, EYE);
    if (s === 'held') px(-U * 0.5, top + 5 * U, U, U, EYE);

    ctx.restore();
  }

  function drawCookie(f) {
    const u = 3, x = f.x - 3 * u, y = f.y - 6 * u;
    const C1 = '#c98a4b', C2 = '#5a3720';
    px(x + u, y, 4 * u, 6 * u, C1);
    px(x, y + u, 6 * u, 4 * u, C1);
    px(x + u * 1.5, y + u * 1.5, u, u, C2);
    px(x + u * 3.5, y + u * 2.5, u, u, C2);
    px(x + u * 2, y + u * 4, u, u, C2);
  }

  function drawHeart(x, y, a, size) {
    ctx.globalAlpha = a;
    const u = size, c = '#e46f8f';
    px(x - 2 * u, y, u * 1.5, u, c); px(x + 0.5 * u, y, u * 1.5, u, c);
    px(x - 2.5 * u, y + u, 5 * u, u, c);
    px(x - 2 * u, y + 2 * u, 4 * u, u, c);
    px(x - u, y + 3 * u, 2 * u, u, c);
    ctx.globalAlpha = 1;
  }

  function drawScene() {
    ctx.clearRect(0, 0, W, H);
    // dotted wallpaper
    ctx.fillStyle = colors.dot;
    for (let y = 18; y < floor - 10; y += 22) for (let x = 14; x < W; x += 22) ctx.fillRect(x, y, 2, 2);
    // desk
    px(0, floor, W, H - floor, colors.desk);
    px(0, floor, W, 3, colors.edge);

    foods.forEach(drawCookie);
    drawPet();

    parts.forEach(q => {
      const a = clamp(1 - q.t / q.life, 0, 1);
      if (q.kind === 'heart') drawHeart(q.x, q.y, a, 2.5);
      else if (q.kind === 'z') {
        ctx.globalAlpha = a; ctx.fillStyle = colors.muted;
        ctx.font = `${q.size}px Silkscreen, monospace`; ctx.fillText('z', q.x, q.y);
        ctx.globalAlpha = 1;
      } else if (q.kind === 'star') {
        ctx.globalAlpha = a; px(q.x - 2, q.y - 2, 4, 4, '#e0a24a'); ctx.globalAlpha = 1;
      }
    });
  }

  // ---- behaviour ----
  function hearts(n = 4) {
    for (let i = 0; i < n; i++) parts.push({ kind: 'heart', x: pet.x + rand(-30, 30), y: pet.y - 10 * U + rand(-10, 10), vy: rand(-50, -30), vx: rand(-10, 10), t: 0, life: rand(1, 1.6) });
  }
  function stars() {
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; parts.push({ kind: 'star', x: pet.x + Math.cos(a) * 40, y: pet.y - 9 * U + Math.sin(a) * 12, vx: -Math.sin(a) * 40, vy: Math.cos(a) * 12, t: 0, life: 1.6 }); }
  }
  function touch() { pet.idleFor = 0; }

  function petHead() {
    touch();
    if (pet.state === 'sleep') { setState('idle', rand(1.5, 3)); say(pick(LINES.wake)); return; }
    if (['held', 'fall', 'jump'].includes(pet.state)) return;
    stats.mood = clamp(stats.mood + 8, 0, 100); lastAction = 'pet';
    setState('happy', 1.3); hearts(); say(pick(LINES.tap));
  }
  function feed() {
    touch();
    foods.push({ x: rand(50, W - 50), y: -10, vy: 0, landed: false });
    if (pet.state === 'sleep') { setState('idle', 0.5); say('…闻到饼干味了！'); }
  }
  function jump() {
    touch();
    if (['held', 'fall', 'jump'].includes(pet.state)) return;
    pet.vy = -560; pet.squash = -0.15; setState('jump');
  }
  function sleep() {
    touch();
    if (pet.state === 'sleep') { setState('idle', 2); say(pick(LINES.wake)); return; }
    if (['held', 'fall', 'jump'].includes(pet.state)) return;
    pet.y = floor; setState('sleep'); say('晚安…', 1.5);
  }

  function nearestFood() {
    let best = null, d = Infinity;
    foods.forEach(f => { if (f.landed && Math.abs(f.x - pet.x) < d) { d = Math.abs(f.x - pet.x); best = f; } });
    return best;
  }

  function update(dt) {
    const p = pet; p.t += dt; p.idleFor += dt;
    p.squash *= Math.pow(0.0005, dt);
    if (Math.abs(p.squash) < 0.005) p.squash = 0;

    // blink
    p.nextBlink -= dt; if (p.blink > 0) p.blink -= dt;
    if (p.nextBlink <= 0) { p.blink = 0.12; p.nextBlink = rand(2, 5); }

    // food physics
    foods.forEach(f => {
      if (f.landed) return;
      f.vy += 1400 * dt; f.y += f.vy * dt;
      if (f.y >= floor) { f.y = floor; f.landed = true; }
    });

    const busy = ['held', 'fall', 'jump', 'eat', 'sleep'].includes(p.state);
    if (!busy && p.state !== 'dizzy') {
      const f = nearestFood();
      if (f) {
        if (Math.abs(f.x - p.x) < 14) { p.foodRef = f; setState('eat', 1.4); say(pick(LINES.eat), 1.4); }
        else if (p.state !== 'walk' || p.target !== f.x) { if (p.state !== 'walk') say('开饭啦！', 1.2); p.target = f.x; setState('walk'); }
      }
    }

    switch (p.state) {
      case 'idle':
        if (p.t > p.next) {
          if (p.idleFor > 25) { setState('sleep'); break; }
          const r = Math.random();
          if (r < 0.55) { p.target = rand(60, W - 60); setState('walk'); }
          else if (r < 0.75) { say(stats.food < 35 ? pick(LINES.hungry) : pick(LINES.idle), 3); setState('idle', rand(3, 6)); }
          else setState('idle', rand(2, 4));
        }
        break;
      case 'walk': {
        const dx = p.target - p.x;
        p.dir = Math.sign(dx) || p.dir;
        const sp = 70;
        p.walkPhase += dt * 7;
        if (Math.abs(dx) <= sp * dt) { p.x = p.target; setState('idle', rand(1.5, 4)); }
        else p.x += p.dir * sp * dt;
        break;
      }
      case 'fall': case 'jump':
        p.vy += 1600 * dt; p.y += p.vy * dt;
        if (p.y >= floor) {
          const hard = p.vy > 900;
          p.y = floor; p.squash = clamp(p.vy / 2500, 0.08, 0.35); p.vy = 0;
          if (hard) { setState('dizzy', 1.8); stars(); say(pick(LINES.land), 1.8); }
          else setState('idle', rand(1, 2.5));
        }
        break;
      case 'happy':
        p.y = floor - Math.abs(Math.sin(p.t * 9)) * 8;
        if (p.t > p.next) { p.y = floor; setState('idle', rand(1.5, 3)); }
        break;
      case 'eat':
        if (p.t > p.next) {
          const i = foods.indexOf(p.foodRef); if (i >= 0) foods.splice(i, 1);
          stats.food = clamp(stats.food + 20, 0, 100); stats.mood = clamp(stats.mood + 4, 0, 100); lastAction = 'eat';
          hearts(2); setState('idle', rand(1, 2));
        }
        break;
      case 'dizzy':
        if (p.t > p.next) setState('idle', rand(1, 2));
        break;
      case 'sleep':
        if (Math.random() < dt * 0.9) parts.push({ kind: 'z', x: p.x + 30 + rand(0, 10), y: p.y - 9 * U, vx: rand(8, 18), vy: -22, t: 0, life: 2.2, size: Math.round(rand(11, 17)) });
        break;
    }

    // stats decay
    stats.food = clamp(stats.food - dt * (p.state === 'sleep' ? 0.015 : 0.035), 0, 100);
    stats.mood = clamp(stats.mood - dt * (p.state === 'sleep' ? 0.005 : 0.025), 0, 100);

    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.t > q.life) parts.splice(i, 1);
    }

    // bubble
    if (bubbleTimer > 0) {
      bubbleTimer -= dt;
      if (bubbleTimer <= 0) bubble.hidden = true;
      else {
        const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
        const left = clamp(p.x - bw / 2, 6, W - bw - 6);
        const top = Math.max(6, p.y - 11 * U - bh - 10);
        bubble.style.transform = `translate(${left}px, ${top}px)`;
      }
    }
  }

  // ---- UI ----
  const foodFill = document.getElementById('foodFill'), moodFill = document.getElementById('moodFill');
  const foodNum = document.getElementById('foodNum'), moodNum = document.getElementById('moodNum');
  function renderStats() {
    foodFill.style.width = stats.food + '%'; moodFill.style.width = stats.mood + '%';
    foodNum.textContent = Math.round(stats.food); moodNum.textContent = Math.round(stats.mood);
  }

  // ---- pointer ----
  let down = null;
  function local(e) { const r = C.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function onPet(pt) { return pt.x > pet.x - 8 * U && pt.x < pet.x + 8 * U && pt.y > pet.y - 11 * U && pt.y < pet.y + U; }

  C.addEventListener('pointerdown', e => {
    const pt = local(e);
    down = { ...pt, hit: onPet(pt), moved: false, id: e.pointerId, lastY: pt.y, vy: 0 };
    C.setPointerCapture(e.pointerId);
  });
  C.addEventListener('pointermove', e => {
    if (!down) return;
    const pt = local(e);
    if (!down.moved && Math.hypot(pt.x - down.x, pt.y - down.y) > 6) {
      down.moved = true;
      if (down.hit) { touch(); setState('held'); say(pick(LINES.held), 1.6); }
    }
    if (pet.state === 'held' && down.hit) {
      pet.x = clamp(pt.x, 50, W - 50);
      pet.y = clamp(pt.y + 5 * U, 11 * U, floor);
      down.vy = (pt.y - down.lastY); down.lastY = pt.y;
    }
  });
  C.addEventListener('pointerup', e => {
    if (!down) return;
    const pt = local(e);
    if (pet.state === 'held') { pet.vy = clamp(down.vy * 30, -300, 600); setState('fall'); }
    else if (!down.moved) {
      if (down.hit) petHead();
      else if (!['fall', 'jump', 'eat'].includes(pet.state)) {
        touch();
        if (pet.state === 'sleep') say(pick(LINES.wake));
        else say(pick(LINES.come), 1.4);
        pet.target = clamp(pt.x, 60, W - 60); setState('walk');
      }
    }
    down = null;
  });
  C.addEventListener('pointercancel', () => { if (pet.state === 'held') setState('fall'); down = null; });

  document.getElementById('btnFeed').addEventListener('click', feed);
  document.getElementById('btnPet').addEventListener('click', petHead);
  document.getElementById('btnJump').addEventListener('click', jump);
  document.getElementById('btnSleep').addEventListener('click', sleep);

  // ---- loop ----
  readColors();
  new ResizeObserver(resize).observe(monitor);
  resize();
  pet.x = W / 2; pet.y = floor;
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  document.fonts && document.fonts.ready.then(readColors);

  if (INIT.sleepy) setState('sleep');
  if (INIT.action === 'feed') { feed(); feed(); }
  else if (INIT.action === 'pet') setTimeout(petHead, 300);
  else say(INIT.sleepy ? '唔…这么晚还不睡？' : '嗨！我是 Clawd～', 2.6);
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    update(dt); drawScene();
    acc += dt; if (acc > 0.5) { acc = 0; renderStats(); }
    requestAnimationFrame(frame);
  }
  renderStats();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
